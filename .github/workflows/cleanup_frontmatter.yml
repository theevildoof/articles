name: Clean front-matter in docs/notebooks

on:
  push:
    paths:
      - 'docs/notebooks/**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Normalize Markdown front matter
        run: python .github/scripts/cleanup_frontmatter.py docs/notebooks

      - name: Commit changes if any
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain docs/notebooks)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/notebooks
            git commit -m "chore: normalize notebook front matter"
            git push
          else
            echo "No changes to commit"
          fi
