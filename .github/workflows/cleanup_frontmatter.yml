name: Clean front-matter in docs/notebooks

on:
  push:
    paths:
      - 'docs/notebooks/**/*.md'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Make cleanup script executable
        run: chmod +x .github/scripts/cleanup_frontmatter.sh

      - name: Clean fenced YAML & leading blank lines
        run: |
          find docs/notebooks -type f -name '*.md' | while read f; do
            ./.github/scripts/cleanup_frontmatter.sh "$f"
          done
        shell: bash

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/notebooks/**/*.md
          git diff --quiet || (git commit -m "chore: clean front-matter in markdown files" && git push)
        shell: bash
