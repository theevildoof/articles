name: Clean front-matter in docs/notebooks

on:
  push:
    paths:
      - 'docs/notebooks/**/*.md'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure script is executable
        run: chmod +x .github/scripts/cleanup-frontmatter.sh

      - name: Find and clean fenced YAML in markdown files
        run: |
          find docs/notebooks -type f -name '*.md' | while read f; do
            ./.github/scripts/cleanup-frontmatter.sh "$f"
          done
        shell: bash

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/notebooks/*.md
          git diff --quiet || git commit -m "chore: clean fenced YAML front matter in markdown files"
          git push
        shell: bash
