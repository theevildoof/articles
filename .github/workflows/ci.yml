name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install notebook tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbconvert nbformat jinja2 traitlets
      - name: Convert notebooks to Markdown
        run: python .github/scripts/convert_notebooks.py
      - name: Normalize Markdown front matter
        run: python .github/scripts/cleanup_frontmatter.py docs/notebooks
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Build with Jekyll
        run: bundle exec jekyll build
