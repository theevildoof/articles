name: Convert notebooks to docs

on:
  push:
    paths:
      - 'notebooks/*.ipynb'
      - 'notebooks/**/*.ipynb'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbconvert nbformat jinja2 traitlets

      - name: Convert notebooks to Markdown
        run: python .github/scripts/convert_notebooks.py

      - name: Normalize exported front matter
        run: python .github/scripts/cleanup_frontmatter.py docs/notebooks

      - name: Commit and push changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain docs/notebooks)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/notebooks
            git commit -m "chore: update notebook exports"
            git push
          else
            echo "No exported changes to commit"
          fi
